[package]
name = "quire-mltl"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Bridges tl-mltl's TL-owned evaluation types to quire-observation's owner-assertion views. The one deliberate exception to tl-mltl's independence from the agent-ix/Quire ecosystem."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-mltl"
publish = false

[workspace]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true

[lib]
name = "quire_mltl"
path = "src/lib.rs"

[dependencies]
tl-mltl = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-mltl", branch = "main" }
quire-observation = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-observation", branch = "main" }
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", branch = "main", default-features = false, features = ["alloc", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[dev-dependencies]
ix-trace-rs = { version = "0.1", git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }

[profile.release]
lto = "thin"
codegen-units = 1
