[package]
name = "quire-mltl"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Bridges tl-mltl's TL-owned evaluation types to quire-observation's owner-assertion views. The one deliberate exception to tl-mltl's independence from the agent-ix/Quire ecosystem."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-mltl"
publish = false

[lib]
name = "quire_mltl"
path = "src/lib.rs"

[dependencies]
tl-mltl = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-mltl", rev = "452f013a3168512603d427bce3360bc14c1175a6" }
quire-observation = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-observation", rev = "2bdeb833a330bfa777c19eb4c28c423f856f3ba6" }
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "4a5614193d21e5ae99950ae683b04ba0ec931358", default-features = false, features = ["alloc", "serde"] }
# Pinned to the exact versions tl-mltl's own Cargo.toml uses, so the wire
# document types ported in TL-178 share one serde/serde_json/sha2 instance
# with the tl-mltl bounded-document machinery (tl_mltl::wire::common) they
# call into, rather than resolving two incompatible copies.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
agent-ix-baseline-producer = { version = "=0.0.0", git = "https://github.com/agent-ix/filament-core-data", rev = "a6fe662542770e6acbec4917cfe1772b349ee414" }

[profile.release]
lto = "thin"
codegen-units = 1
