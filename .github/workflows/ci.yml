name: CI

# GitHub Actions is intentionally workflow_dispatch-only. There is no push or
# pull_request trigger: local `make ci` is the iteration gate, and a hosted
# run is dispatched once for a finalized revision.
on:
  workflow_dispatch:
jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact rust-toolchain.toml channel so hosted CI checks
      # the same compiler local `make ci` runs under, not whatever "stable"
      # resolves to on the runner.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Unsafe audit
        run: bash scripts/check_unsafe_comments.sh

      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny policy
        run: |
          cargo deny check licenses
          cargo deny check sources
